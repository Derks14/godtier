spring:
  application:
    name: godtier
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: true

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}


management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_ENPOINT}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENPOINT}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_LOGS_ENDPOINT}



